name: Fix TE output
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        run: |
          python3 - <<'EOF'
          import io
          p = "app/src/main/java/com/apkcreator/offlineart/DiffusionPipelineKt.kt"
          s = io.open(p, encoding="utf-8").read()
          s = s.replace("    private val te: OrtSession\n", "    private val te: OrtSession\n    private val teOut: String\n")
          s = s.replace('require(te.outputNames.size == 1) { "TE: unexpected outputs" }', 'teOut = te.outputNames.firstOrNull { it == "last_hidden_state" } ?: te.outputNames.first()')
          s = s.replace("val v = r[0].value as Array<Array<FloatArray>>", "val v = (r.get(teOut) ?: r[0]).value as Array<Array<FloatArray>>")
          assert "private val teOut" in s and "last_hidden_state" in s and "r.get(teOut)" in s, "patch failed"
          io.open(p, "w", encoding="utf-8").write(s)
          print("patched OK")
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Fix TE output select" || echo "nothing to commit"
          git push
