name: Fix Kotlin bugs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        run: |
          python3 - <<'EOF'
          import io, re
          p1 = "app/src/main/java/com/apkcreator/offlineart/LcmSchedulerKt.kt"
          s = io.open(p1, encoding="utf-8").read()
          s = s.replace("    trainSteps: Int = 1000,", "    private val trainSteps: Int = 1000,")
          assert "private val trainSteps" in s, "patch1 failed"
          io.open(p1, "w", encoding="utf-8").write(s)
          p2 = "app/src/main/java/com/apkcreator/offlineart/ClipTokenizerKt.kt"
          t = io.open(p2, encoding="utf-8").read()
          t = re.sub(r"if \(ch in 'A'.*?\|\| ch in 'Z'\)", "if (ch in 'A'..'Z')", t, flags=re.S)
          assert "ch in 'A'..'Z'" in t, "patch2 failed"
          io.open(p2, "w", encoding="utf-8").write(t)
          print("patched OK")
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Fix Kotlin compile errors" || echo "nothing to commit"
          git push
